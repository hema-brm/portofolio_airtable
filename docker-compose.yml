version: "3.1"

services:
  backend:
    build:
      context: backend/
    ports:
      - "8000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app/backend

  frontend:
    build:
      context: frontend/
    ports:
      - "80:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app/frontend
